name: Compile and smoke-test DAYBOARD on Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain (Windows MSVC)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build files
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check frontend JavaScript syntax
        run: node --check web/app.js
      - name: Test native Rust logic
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Windows x64 release and NSIS installer
        run: cargo tauri build
        working-directory: src-tauri
      - name: Check native x64 executable and run smoke test
        shell: pwsh
        run: ./tests/smoke-windows.ps1
      - name: Upload Windows installer and standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: DAYBOARD-Tauri-Windows-x64
          path: |
            src-tauri/target/release/dayboard.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
